MEMORY {
    ROM0: start = $E000, size = $2000, fill = yes, file = %O;   # bank 0 (reset bank, MPR7)
    ROMD: start = $8000, size = $6000, fill = yes, file = %O;   # banks 1-3 via MPR4-6
}
SEGMENTS {
    CODE: load = ROM0, type = ro;
    VEC:  load = ROM0, type = ro, start = $FFF6;
    DATA: load = ROMD, type = ro;
}
